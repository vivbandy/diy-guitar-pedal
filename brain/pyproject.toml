[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-architect"
version = "0.1.0"
description = "Natural-language guitar tone requests -> validated patch.json for an Audio Unit plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
cloud = ["anthropic>=0.40"]
local = ["httpx>=0.27"]
supabase = ["supabase>=2.4"]
tone3000 = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tone-architect = "tone_architect.cli:main"
tone-sync = "tone_architect.sync:main"
tone-scaffold-manifest = "tone_architect.scaffold_manifest:main"
tone3000-sync = "tone_architect.tone3000:main"
tone3000-login = "tone_architect.tone3000_auth:main"

[tool.setuptools.packages.find]
include = ["tone_architect*"]

[tool.setuptools.package-data]
tone_architect = ["prompts/*.md", "prompts/grammar/*.gbnf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum is the pydantic idiom and serialises predictably; StrEnum changes str() semantics.
ignore = ["UP042"]
